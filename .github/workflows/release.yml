# Релиз модуля: пуш тега v* -> GitHub Release + Docker-образ в GHCR.
#
#   git tag v0.5.3
#   git push origin v0.5.3
#
# Образы:
#   ghcr.io/<организация>/managerdatabase:v0.5.3
#   ghcr.io/<организация>/managerdatabase:latest
#
# После первого пуша откройте пакет в GHCR и при желании сделайте его публичным
# (Packages -> managerdatabase -> Package settings -> Change visibility),
# иначе на сервере ReportPalette потребуется `docker login ghcr.io`.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # создание GitHub Release
  packages: write   # пуш образа в GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push module image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            MODULE_VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
